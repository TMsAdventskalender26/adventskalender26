<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2440">
<meta name="robots" content="noindex, nofollow">
<title>Kattekalender 2026</title>
<style>
  :root { --bg:#1d2440; --fg:#fdf6e3; --accent:#f2b84b; --soft:#9fb3d9; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; -webkit-text-size-adjust:100%; background:var(--bg); color:var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         display:flex; align-items:center; justify-content:center; text-align:center; overflow:hidden; }
  main { padding:calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); max-width:520px; position:relative; z-index:1; }
  h1 { font-size:clamp(1.8rem, 7vw, 2.8rem); margin:0 0 .3em; color:var(--accent); }
  p { font-size:1.15rem; line-height:1.5; margin:.4em 0; }
  #nedtelling { font-size:1.4rem; font-weight:600; margin-top:1em; color:var(--soft); min-height:1.6em; }
  .cat { width:min(220px, 60vw); margin:0 auto 1em; display:block; }
  .tail { transform-origin:150px 150px; animation:wag 2.4s ease-in-out infinite; }
  .eye  { animation:blink 5s infinite; transform-origin:center; transform-box:fill-box; }
  @keyframes wag { 0%,100% { transform:rotate(-8deg); } 50% { transform:rotate(10deg); } }
  @keyframes blink { 0%,92%,100% { transform:scaleY(1); } 95% { transform:scaleY(.1); } }
  .snow { position:fixed; top:-10px; color:#fff; opacity:.7; animation:fall linear infinite; z-index:0; }
  @keyframes fall { to { transform:translateY(110vh); } }
  @media (prefers-reduced-motion: reduce) { .tail,.eye,.snow { animation:none; } .snow { display:none; } }
</style>
</head>
<body>
<main>
  <svg class="cat" viewBox="0 0 220 200" aria-hidden="true">
    <path class="tail" d="M150 150 C 200 150, 205 90, 180 70" stroke="#3b3b3b" stroke-width="12" fill="none" stroke-linecap="round"/>
    <ellipse cx="110" cy="150" rx="55" ry="40" fill="#3b3b3b"/>
    <circle cx="110" cy="85" r="40" fill="#3b3b3b"/>
    <path d="M78 62 L84 28 L102 52 Z M142 62 L136 28 L118 52 Z" fill="#3b3b3b"/>
    <ellipse class="eye" cx="96" cy="84" rx="6" ry="8" fill="#f2b84b"/>
    <ellipse class="eye" cx="124" cy="84" rx="6" ry="8" fill="#f2b84b"/>
    <path d="M106 98 L114 98 L110 103 Z" fill="#e89aa6"/>
  </svg>
  <h1>Kattekalender 2026</h1>
  <p>Noen har planlagt noe i kjøkkenet …</p>
  <p>Den første luka åpner <strong>1. desember</strong>.</p>
  <div id="nedtelling"></div>
</main>
<script>
(function () {
  var target = Date.UTC(2026, 11, 1, 5, 0, 0); // 1 Dec 2026 06:00 Norwegian time (CET = UTC+1)
  function tekst(ms) {
    if (ms <= 0) return "Luka er åpen! Last inn siden på nytt.";
    var d = Math.floor(ms / 86400000), t = Math.floor(ms / 3600000) % 24, m = Math.floor(ms / 60000) % 60;
    return d + (d === 1 ? " dag, " : " dager, ") + t + (t === 1 ? " time og " : " timer og ") + m + (m === 1 ? " minutt igjen" : " minutter igjen");
  }
  function oppdater() { var el = document.getElementById("nedtelling"); if (el) el.textContent = tekst(target - Date.now()); }
  if (typeof window !== "undefined") { window.kalenderTekst = tekst; }
  oppdater(); setInterval(oppdater, 30000);
  for (var i = 0; i < 25; i++) {
    var s = document.createElement("div"); s.className = "snow"; s.textContent = "❄";
    s.style.left = (Math.random() * 100) + "vw"; s.style.fontSize = (8 + Math.random() * 14) + "px";
    s.style.animationDuration = (6 + Math.random() * 10) + "s"; s.style.animationDelay = (-Math.random() * 16) + "s";
    document.body.appendChild(s);
  }
})();
</script>
</body>
</html>
